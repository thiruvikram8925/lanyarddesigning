; GOTEK ID Card System - PHP Configuration for Hostinger
; Place this file in the public_html root directory

; ============================================
; FILE UPLOAD SETTINGS (up to 10GB PDF uploads)
; ============================================
upload_max_filesize = 10240M
post_max_size = 10500M
max_file_uploads = 20
file_uploads = On

; ============================================
; EXECUTION TIME LIMITS (60 minutes for 10GB)
; ============================================
max_execution_time = 3600
max_input_time = 3600

; ============================================
; MEMORY LIMITS
; ============================================
memory_limit = 512M

; ============================================
; ERROR HANDLING (useful for debugging)
; ============================================
display_errors = Off
log_errors = On
error_log = error_log.txt
