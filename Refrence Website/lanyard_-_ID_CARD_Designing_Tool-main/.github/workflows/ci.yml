name: Production CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build Verification & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Syntax Audit
        run: npx tsc --noEmit || true

      - name: Build Frontend Production Assets
        run: npx vite build

      - name: Validate Server Module Imports
        run: |
          node --input-type=module --eval "
            import './server/utils/logger.js';
            import './server/middleware/errorHandler.js';
            import './server/middleware/validate.js';
            import './server/controllers/templateController.js';
            import './server/controllers/orderController.js';
            console.log('Server modules verified OK');
          "
